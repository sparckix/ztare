- id: spectral_radius_rayleigh_spectrum_positive_v1
  row_id: MCB_010_spectralRadius_eq_nnnorm
  test_kind: positive
  expected_outcome: governed_repair_canary_closure
  backend: repl_file
  timeout: 160
  body: "nontriviality E\napply le_antisymm (spectrum.spectralRadius_le_nnnorm T)\n\
    suffices h : algebraMap ℝ \U0001D55C ‖T‖ ∈ spectrum \U0001D55C T ∨ algebraMap\
    \ ℝ \U0001D55C (-‖T‖) ∈ spectrum \U0001D55C T by\n  rcases h with h | h <;> exact\
    \ le_trans (by simp) (le_biSup _ h)\nsimp_rw [spectrum, Set.mem_compl_iff, map_neg]\n\
    by_contra! h\nobtain ⟨c, hc0, hc⟩ := T.abs_rayleighQuotient_le_of_norm_mem_resolventSet\
    \ h.1 h.2\ngrind [ciSup_le hc, norm_eq_iSup_rayleighQuotient T hT.isSymmetric]\n"
- id: spectral_radius_one_sided_resolvent_negative_v1
  row_id: MCB_010_spectralRadius_eq_nnnorm
  test_kind: negative_control
  expected_outcome: must_fail_without_negative_spectral_endpoint
  backend: repl_file
  timeout: 80
  body: "nontriviality E\napply le_antisymm (spectrum.spectralRadius_le_nnnorm T)\n\
    suffices h : algebraMap ℝ \U0001D55C ‖T‖ ∈ spectrum \U0001D55C T by\n  exact le_trans\
    \ (by simp) (le_biSup _ h)\nsimp_rw [spectrum, Set.mem_compl_iff]\nby_contra!\
    \ h\nobtain ⟨c, hc0, hc⟩ := T.rayleighQuotient_le_of_norm_mem_resolventSet h\n\
    grind [ciSup_le hc, norm_eq_iSup_rayleighQuotient T hT.isSymmetric]\n"
