      negative_candidate: cusp_function_zero_missing_bounded_extension_negative_v1
      candidate_names:
        - cusp_function_zero_removable_positive_v1
        - cusp_function_zero_missing_bounded_extension_negative_v1
  schema: leanmill-target-probe-contract-v1
templates:
  - id: cusp_function_qparam_left_inverse_positive_v1
    row_id: MCB_141_eq_cuspFunction
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 120
    body: |
      have : (cuspFunction h f) (𝕢 h z) = f (invQParam h (𝕢 h z)) := by
        rw [cuspFunction, update_of_ne, comp_apply]
        exact exp_ne_zero _
      obtain ⟨m, hm⟩ := qParam_left_inv_mod_period hh z
      simpa only [this, hm] using hf.int_mul m z
  - id: cusp_function_missing_periodicity_negative_v1
    row_id: MCB_141_eq_cuspFunction
    test_kind: negative_control
    expected_outcome: must_fail_without_periodicity_transport_from_inverse_qparam
    backend: repl_file
    timeout: 70
    body: |
      have : (cuspFunction h f) (𝕢 h z) = f (invQParam h (𝕢 h z)) := by
        rw [cuspFunction, update_of_ne, comp_apply]
        exact exp_ne_zero _
      obtain ⟨m, hm⟩ := qParam_left_inv_mod_period hh z
      simpa only [this, hm]
  - id: cusp_function_eventual_diff_positive_v1
    row_id: MCB_142_eventually_differentiableAt_cusp
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 160
    body: |
      refine ((invQParam_tendsto hh).eventually h_hol).mp <|
        eventually_nhdsWithin_of_forall (fun q hq h_diff => by
          rw [← qParam_right_inv hh.ne' hq]
          exact differentiableAt_cuspFunction hh.ne' hf h_diff)
  - id: cusp_function_eventual_diff_missing_right_inverse_negative_v1
    row_id: MCB_142_eventually_differentiableAt_cusp
    test_kind: negative_control
    expected_outcome: must_fail_without_qparam_right_inverse_bridge
    backend: repl_file
    timeout: 80
    body: |
      refine ((invQParam_tendsto hh).eventually h_hol).mp <|
        eventually_nhdsWithin_of_forall (fun q hq h_diff => by
          exact differentiableAt_cuspFunction hh.ne' hf h_diff)
  - id: cusp_function_zero_removable_positive_v1
    row_id: MCB_144_differentiableAt_cuspFunction_ze
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 220
    body: |
      obtain ⟨c, t⟩ := (boundedAtFilter_cuspFunction hh h_bd).bound
      replace t := (eventually_differentiableAt_cuspFunction_nhds_ne_zero hh hf h_hol).and t
      simp only [norm_one, Pi.one_apply, mul_one] at t
      obtain ⟨S, hS1, hS2, hS3⟩ := eventually_nhds_iff.mp (eventually_nhdsWithin_iff.mp t)
      have h_diff : DifferentiableOn ℂ (cuspFunction h f) (S \ {0}) :=
        fun x hx ↦ (hS1 x hx.1 hx.2).1.differentiableWithinAt
      have hF_bd : BddAbove (norm ∘ cuspFunction h f '' (S \ {0})) := by
        use c
        simp only [mem_upperBounds, Set.mem_image, Set.mem_diff, forall_exists_index, and_imp]
        intro y q hq hq2 hy
        simpa only [← hy, norm_one, mul_one] using (hS1 q hq hq2).2
      have := differentiableOn_update_limUnder_of_bddAbove (IsOpen.mem_nhds hS2 hS3) h_diff hF_bd
      rw [← cuspFunction_zero_eq_limUnder_nhds_ne, update_eq_self] at this
      exact this.differentiableAt (IsOpen.mem_nhds hS2 hS3)
  - id: cusp_function_zero_missing_bounded_extension_negative_v1
    row_id: MCB_144_differentiableAt_cuspFunction_ze
    test_kind: negative_control
    expected_outcome: must_fail_without_bounded_removable_singularity_bridge
    backend: repl_file
    timeout: 100
    body: |
      obtain ⟨c, t⟩ := (boundedAtFilter_cuspFunction hh h_bd).bound
      replace t := (eventually_differentiableAt_cuspFunction_nhds_ne_zero hh hf h_hol).and t
      simp only [norm_one, Pi.one_apply, mul_one] at t
      obtain ⟨S, hS1, hS2, hS3⟩ := eventually_nhds_iff.mp (eventually_nhdsWithin_iff.mp t)
      have h_diff : DifferentiableOn ℂ (cuspFunction h f) (S \ {0}) :=
        fun x hx ↦ (hS1 x hx.1 hx.2).1.differentiableWithinAt
      exact h_diff.differentiableAt (IsOpen.mem_nhds hS2 hS3)
  - id: eventually_eq_or_eq_zero_of_isLocalMin_norm_positive_v1
    row_id: MCB_112_eventually_eq_or_eq_zero_of_isLo
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 140
    body: |
      refine or_iff_not_imp_right.mpr fun hzero => by
        have h1 : ∀ᶠ z in 𝓝 c, f z ≠ 0 := hf.self_of_nhds.continuousAt.eventually_ne hzero
        have h2 : IsLocalMax (norm ∘ f)⁻¹ c := hc.inv (h1.mono fun z hz => norm_pos_iff.mpr hz)
        have h3 : IsLocalMax (norm ∘ f⁻¹) c := by
          refine h2.congr (Eventually.of_forall (fun z => by simp))
        have h4 : ∀ᶠ z in 𝓝 c, DifferentiableAt ℂ f⁻¹ z := by
          filter_upwards [hf, h1] with z hz hdiff using hdiff.inv
        filter_upwards [eventually_eq_of_isLocalMax_norm h4 h3] with z using inv_inj.mp
  - id: eventually_eq_or_eq_zero_of_isLocalMin_norm_missing_reciprocal_bridge_negative_v1
    row_id: MCB_112_eventually_eq_or_eq_zero_of_isLo
    test_kind: negative_control
    expected_outcome: must_fail_without_reciprocal_nonzero_bridge
    backend: repl_file
    timeout: 90
    body: |
      refine or_iff_not_imp_right.mpr fun hzero => by
        have h1 : ∀ᶠ z in 𝓝 c, f z ≠ 0 := hf.self_of_nhds.continuousAt.eventually_ne hzero
        have h2 : IsLocalMax (norm ∘ f)⁻¹ c := hc.inv (h1.mono fun z hz => norm_pos_iff.mpr hz)
        have h4 : ∀ᶠ z in 𝓝 c, DifferentiableAt ℂ f⁻¹ z := by
          filter_upwards [hf, h1] with z hz hdiff using hdiff.inv
        filter_upwards [eventually_eq_of_isLocalMax_norm h4 h2] with z using inv_inj.mp
  - id: analyticAt_iff_eventually_differentiableAt_positive_v1
    row_id: MCB_136_analyticAt_iff_eventually_differ
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 120
    body: |
      constructor
      · intro ha
        filter_upwards [ha.eventually_analyticAt]
        exact AnalyticAt.differentiableAt
      · intro hd
        rcases _root_.eventually_nhds_iff.mp hd with ⟨s, hs, o, m⟩
        exact (DifferentiableOn.analyticOnNhd (fun z hz => (hs z hz).differentiableWithinAt) o) _ m
  - id: analyticAt_iff_eventually_differentiableAt_missing_open_set_bridge_negative_v1
    row_id: MCB_136_analyticAt_iff_eventually_differ
    test_kind: negative_control
    expected_outcome: must_fail_without_eventual_to_nhds_bridge
    backend: repl_file
    timeout: 80
    body: |
      constructor
      · intro ha
        filter_upwards [ha.eventually_analyticAt]
        exact AnalyticAt.differentiableAt
      · intro hd
        exact (DifferentiableOn.analyticOnNhd (fun z hz => (hd z hz).differentiableWithinAt)
          (by
            rcases _root_.eventually_nhds_iff.mp hd with ⟨s, hs, o, m⟩
            exact o)) _ (by
          rcases _root_.eventually_nhds_iff.mp hd with ⟨s, hs, o, m⟩
          exact o)
  - id: differentiableOn_compl_singleton_and_continuousAt_positive_v1
    row_id: MCB_108_differentiableOn_compl_singleton
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 180
    body: |
      simpa using (differentiableOn_compl_singleton_and_continuousAt_iff (f := f) (s := s) (c := c) hs)
  - id: differentiableOn_compl_singleton_and_continuousAt_missing_punctured_bridge_negative_v1
    row_id: MCB_108_differentiableOn_compl_singleton
    test_kind: negative_control
    expected_outcome: must_fail_without_punctured_differentiability_bridge
    backend: repl_file
    timeout: 100
    body: |
      simpa using (differentiableOn_compl_singleton_and_continuousAt_iff (f := f) (s := s) (c := c) hs).symm
