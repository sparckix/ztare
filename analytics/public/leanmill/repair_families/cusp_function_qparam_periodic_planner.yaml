    - missing qParam right inverse bridge
    - missing bounded removable-singularity bridge
    - collapse eventual differentiability into pointwise differentiability
    - drop the zero-point carrier and try to close by local differentiability alone
    - use `Function.Periodic.zsmul_eq` without the explicit qParam/cusp adapter
  positive_artifacts:
    - /tmp/rung1/ratified_proofs/eq_cuspFunction_20260521T162504.lean
    - /tmp/rung1/ratified_proofs/eventually_differentiableAt_cuspFunction_nhds_ne_20260523T062718.lean
    - /tmp/rung1/ratified_proofs/differentiableAt_cuspFunction_zero_20260522T214217.lean
  required_artifacts:
    - positive target replay for MCB_142_eventually_differentiableAt_cusp
    - matched negative-control failure for MCB_142_eventually_differentiableAt_cusp
    - positive target replay for MCB_144_differentiableAt_cuspFunction_ze
    - matched negative-control failure for MCB_144_differentiableAt_cuspFunction_ze
    - row-local evidence only
