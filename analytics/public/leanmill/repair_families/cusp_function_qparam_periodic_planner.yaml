    - Reuse the existing row-local heldout canary spec for MCB_144.
    - Preserve the row-specific negative control.
    - Keep MCB_141_eq_cuspFunction and MCB_142_eventually_differentiableAt_cusp out of the replay scope.
  checks:
    - The positive replay must retain the boundedAtFilter_cuspFunction estimate.
    - The negative control must fail once the bounded extension bridge is removed.
  sibling_or_heldout_constraints:
    - Use only MCB_142_eventually_differentiableAt_cusp and MCB_144_differentiableAt_cuspFunction_ze.
    - Keep the periodicity transport from inverse qParam explicit before the eventual-differentiability step for MCB_142.
    - Keep the punctured-neighborhood and `qParam_right_inv` bridge explicit for MCB_142.
    - Keep the bounded removable-singularity bridge explicit and preserve the zero-point carrier for MCB_144.
    - Do not collapse eventual differentiability into pointwise differentiability.
    - Do not reopen source-bound probing while source requests are held.
    - Do not edit scoreboards, registries, governance reports, research logs, or governance receipts.
  paired_negative_controls:
