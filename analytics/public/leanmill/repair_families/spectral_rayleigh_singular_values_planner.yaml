templates:
  - id: singular_values_antitone_positive_v1
    row_id: MCB_019_singularValues_antitone
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 160
    body: |
      intro i j hij
      by_cases hj : finrank 𝕜 E ≤ j
      · simpa [T.singularValues_of_finrank_le hj] using T.singularValues_nonneg i
      have hj' : j < finrank 𝕜 E := lt_of_not_ge hj
      have hi : i < finrank 𝕜 E := hij.trans_lt hj'
      have hsq : (T.singularValues j : ℝ) ^ 2 ≤ (T.singularValues i : ℝ) ^ 2 := by
        rw [T.sq_singularValues_fin rfl ⟨j, hj'⟩, T.sq_singularValues_fin rfl ⟨i, hi⟩]
        exact T.isSymmetric_adjoint_comp_self.eigenvalues_antitone rfl hij
      exact le_of_sq_le_sq hsq (T.singularValues_nonneg i)
  - id: singular_values_antitone_missing_bridge_negative_v1
    row_id: MCB_019_singularValues_antitone
    test_kind: negative_control
    expected_outcome: must_fail_without_eigenvalue_antitone_bridge
    backend: repl_file
    timeout: 80
    body: |
      intro i j hij
      by_cases hj : finrank 𝕜 E ≤ j
      · simpa [T.singularValues_of_finrank_le hj] using T.singularValues_nonneg i
      have hj' : j < finrank 𝕜 E := lt_of_not_ge hj
      have hi : i < finrank 𝕜 E := hij.trans_lt hj'
      have hsq : (T.singularValues j : ℝ) ^ 2 ≤ (T.singularValues i : ℝ) ^ 2 := by
        rw [T.sq_singularValues_fin rfl ⟨j, hj'⟩, T.sq_singularValues_fin rfl ⟨i, hi⟩]
        exact T.isPositive_adjoint_comp_self.nonneg_eigenvalues rfl ⟨j, hj'⟩
      exact le_of_sq_le_sq hsq (T.singularValues_nonneg i)
  - id: spectral_radius_rayleigh_spectrum_positive_v1
    row_id: MCB_010_spectralRadius_eq_nnnorm
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 160
    body: |
      nontriviality E
      apply le_antisymm (spectrum.spectralRadius_le_nnnorm T)
      suffices h : algebraMap ℝ 𝕜 ‖T‖ ∈ spectrum 𝕜 T ∨ algebraMap ℝ 𝕜 (-‖T‖) ∈ spectrum 𝕜 T by
        rcases h with h | h <;> exact le_trans (by simp) (le_biSup _ h)
      simp_rw [spectrum, Set.mem_compl_iff, map_neg]
      by_contra! h
      obtain ⟨c, hc0, hc⟩ := T.abs_rayleighQuotient_le_of_norm_mem_resolventSet h.1 h.2
      grind [ciSup_le hc, norm_eq_iSup_rayleighQuotient T hT.isSymmetric]
  - id: spectral_radius_one_sided_resolvent_negative_v1
    row_id: MCB_010_spectralRadius_eq_nnnorm
    test_kind: negative_control
    expected_outcome: must_fail_without_negative_spectral_endpoint
    backend: repl_file
    timeout: 80
    body: |
      nontriviality E
      apply le_antisymm (spectrum.spectralRadius_le_nnnorm T)
      suffices h : algebraMap ℝ 𝕜 ‖T‖ ∈ spectrum 𝕜 T by
        exact le_trans (by simp) (le_biSup _ h)
      simp_rw [spectrum, Set.mem_compl_iff]
      by_contra! h
      obtain ⟨c, hc0, hc⟩ := T.rayleighQuotient_le_of_norm_mem_resolventSet h
      grind [ciSup_le hc, norm_eq_iSup_rayleighQuotient T hT.isSymmetric]
