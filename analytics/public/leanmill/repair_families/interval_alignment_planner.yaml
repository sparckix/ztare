  backend: repl_file
  timeout: 80
  body: "have hk0 : k ≠ 0 := by\n  intro hk\n  subst hk\n  simp at *\nhave hk1 : k\
    \ ≤ max (k + 1) n := le_trans (Nat.le_succ _ ) (le_max_left _ _)\nexact (sum_Ioc_inv_sq_le_sub\
    \ hk0 hk1).trans (by\n  simp only [Nat.cast_succ, sub_le_self_iff, inv_nonneg,\
    \ Nat.cast_nonneg]\n  gcongr\n  have A : (1 : α) ≤ k + 1 := by simp only [le_add_iff_nonneg_left,\
    \ Nat.cast_nonneg]\n  simpa using pow_right_mono₀ A one_le_two)\n"
