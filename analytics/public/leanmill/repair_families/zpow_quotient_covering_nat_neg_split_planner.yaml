      refine .of_isCoveringMap_restrictPreimage _ (by simp)
        (by
          convert isClosed_singleton (x := (0 : 𝕜)).isOpen_compl using 1
          ext; simp [this])
        (by
          convert (isCoveringMap_zpow n hn).comp_homeomorph (.setCongr _) using 1
          ext; simpa using (this _).not)
