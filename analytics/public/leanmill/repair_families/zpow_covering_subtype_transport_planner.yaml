  schema: leanmill-target-probe-contract-v1
templates:
  - id: eventually_eq_or_eq_zero_of_isLocalMin_norm_positive_v1
    row_id: MCB_112_eventually_eq_or_eq_zero_of_isLo
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 140
    body: |
      refine or_iff_not_imp_right.mpr fun hzero => by
        have h1 : ∀ᶠ z in 𝓝 c, f z ≠ 0 := hf.self_of_nhds.continuousAt.eventually_ne hzero
        have h2 : IsLocalMax (norm ∘ f)⁻¹ c := hc.inv (h1.mono fun z hz => norm_pos_iff.mpr hz)
        have h3 : IsLocalMax (norm ∘ f⁻¹) c := by
          refine h2.congr (Eventually.of_forall (fun z => by simp))
        have h4 : ∀ᶠ z in 𝓝 c, DifferentiableAt ℂ f⁻¹ z := by
          filter_upwards [hf, h1] with z hz hdiff using hdiff.inv
        filter_upwards [eventually_eq_of_isLocalMax_norm h4 h3] with z using inv_inj.mp
  - id: eventually_eq_or_eq_zero_of_isLocalMin_norm_missing_reciprocal_bridge_negative_v1
    row_id: MCB_112_eventually_eq_or_eq_zero_of_isLo
    test_kind: negative_control
    expected_outcome: must_fail_without_reciprocal_nonzero_bridge
    backend: repl_file
    timeout: 90
    body: |
      refine or_iff_not_imp_right.mpr fun hzero => by
        have h1 : ∀ᶠ z in 𝓝 c, f z ≠ 0 := hf.self_of_nhds.continuousAt.eventually_ne hzero
        have h2 : IsLocalMax (norm ∘ f)⁻¹ c := hc.inv (h1.mono fun z hz => norm_pos_iff.mpr hz)
        have h4 : ∀ᶠ z in 𝓝 c, DifferentiableAt ℂ f⁻¹ z := by
          filter_upwards [hf, h1] with z hz hdiff using hdiff.inv
        filter_upwards [eventually_eq_of_isLocalMax_norm h4 h2] with z using inv_inj.mp
  - id: superpolynomialDecay_iff_zpow_tendsto_zero_positive_v1
    row_id: MCB_177_superpolynomialDecay_iff_zpow_te
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 160
    body: |
      refine (superpolynomialDecay_iff_zpow_tendsto_zero f hk).2 (by
        intro n hn
        simpa using hpow n hn)
  - id: superpolynomialDecay_iff_zpow_tendsto_zero_missing_decay_bridge_negative_v1
    row_id: MCB_177_superpolynomialDecay_iff_zpow_te
    test_kind: negative_control
    expected_outcome: must_fail_without_zpow_tendsto_zero_bridge
    backend: repl_file
    timeout: 80
    body: |
      refine (superpolynomialDecay_iff_zpow_tendsto_zero f hk).1 (by
        intro n hn
        exact hpow n hn)
  - id: zpow_covering_on_from_subtype_positive_v1
    row_id: MCB_138_isCoveringMapOn_zpow
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 140
    body: |
      have (x : 𝕜) : x ^ n = 0 ↔ x = 0 := zpow_eq_zero_iff (by aesop)
      refine .of_isCoveringMap_restrictPreimage _ (by simp)
        (by
          convert isClosed_singleton (x := (0 : 𝕜)).isOpen_compl using 1
          ext; simp [this])
        (by
          convert (isCoveringMap_zpow n hn).comp_homeomorph (.setCongr _) using 1
          ext; simpa using (this _).not)
  - id: zpow_covering_missing_subtype_transport_negative_v1
    row_id: MCB_138_isCoveringMapOn_zpow
    test_kind: negative_control
    expected_outcome: must_fail_without_zpow_zero_locus_transport
    backend: repl_file
    timeout: 120
    body: |
      refine .of_isCoveringMap_restrictPreimage _ (by simp)
        (by exact isClosed_singleton (x := (0 : 𝕜)).isOpen_compl)
        (by
          convert (isCoveringMap_zpow n hn).comp_homeomorph (.setCongr _) using 1
          ext; simp)
  - id: zpow_covering_subtype_transport_quotient_positive_v1
    row_id: MCB_139_isQuotientCoveringMap_zpow
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 160
    body: |
      obtain ⟨n, rfl | rfl⟩ := n.eq_nat_or_neg
      · exact isQuotientCoveringMap_npow n (by aesop) (by simpa using surj)
      rw [show (zpowGroupHom (α := 𝕜ˣ) (-n)).ker = (powMonoidHom n).ker by ext; simp]
      convert (isQuotientCoveringMap_npow n (by aesop) _).homeomorph_comp (.inv 𝕜ˣ) using 1
      · ext; simp
      convert inv_involutive.surjective.comp surj; simp
  - id: zpow_quotient_covering_missing_negative_branch_transport_negative_v1
    row_id: MCB_139_isQuotientCoveringMap_zpow
    test_kind: negative_control
    expected_outcome: must_fail_without_negative_branch_transport
    backend: repl_file
    timeout: 120
    body: |
      obtain ⟨n, rfl | rfl⟩ := n.eq_nat_or_neg
      · exact isQuotientCoveringMap_npow n (by aesop) (by simpa using surj)
      · exact isQuotientCoveringMap_npow n (by aesop) (by simpa using surj)
