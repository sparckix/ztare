      simpa using (isBigOWith_of_div_tendsto_nhds (C := C) (a := a) (f := f) (g := g) (l := l) h hC ha)
  - id: isBigOWith_of_div_tendsto_nhds_missing_lower_bound_bridge_negative_v1
    row_id: MCB_162_isBigOWith_of_div_tendsto_nhds
    test_kind: negative_control
    expected_outcome: must_fail_without_lower_bound_bridge
    backend: repl_file
    timeout: 80
    body: |
      simpa using (isBigOWith_of_div_tendsto_nhds (C := C) (a := a) (f := f) (g := g) (l := l) h hC
        (show Tendsto g l (𝓝 (a + 1)) from ha))
  - id: norm_dslope_le_div_of_mapsTo_ball_positive_v1
    row_id: MCB_154_norm_dslope_le_div_of_mapsTo_bal
