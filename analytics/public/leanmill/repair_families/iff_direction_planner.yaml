      check: Keep the constructor split explicit and separate the forward and reverse rewrite directions. Treat the inequality lemma as supporting shape only; it should not substitute for the equality-case iff direction.
    - row_id: MCB_064_mem_adjoint_domain_of_exists
      kind: heldout_constructor_split
