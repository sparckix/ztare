  - id: geom_mean_eq_arith_mean_weighted_iff_prime_positive_v1
    row_id: MCB_025_geom_mean_eq_arith_mean_weighted
    test_kind: positive
    expected_outcome: governed_repair_canary_closure
    backend: repl_file
    timeout: 220
    body: |
      constructor
      · intro h
        by_cases hzero : ∃ i ∈ s, z i = 0
        · rcases hzero with ⟨i, hi, hzi⟩
          have hprod : ∏ i ∈ s, z i ^ w i = 0 := by
            rw [prod_eq_zero hi]
            rw [hzi]
            exact zero_rpow (ne_of_gt (hw i hi))
          have hsum : ∑ i ∈ s, w i * z i = 0 := by
            rw [hprod] at h
            exact h.symm
          have hzero' : ∀ j ∈ s, z j = 0 := by
            have hmul :
                ∀ j ∈ s, w j * z j = 0 :=
              (sum_eq_zero_iff_of_nonneg fun j hj =>
                mul_nonneg (le_of_lt (hw j hj)) (hz j hj)).mp hsum
            intro j hj
            exact (mul_eq_zero.mp (hmul j hj)).resolve_left (ne_of_gt (hw j hj))
          intro j hj
          rw [hzero' j hj, hsum]
        · have hzpos : ∀ i ∈ s, 0 < z i := by
            intro i hi
            exact lt_of_le_of_ne (hz i hi) fun hzi => hzero ⟨i, hi, hzi.symm⟩
          by_cases hne : ∃ j ∈ s, ∃ k ∈ s, z j ≠ z k
          · rcases hne with ⟨j, hj, k, hk, hjk⟩
            have hlog : ∃ j ∈ s, ∃ k ∈ s, log (z j) ≠ log (z k) := by
              exact ⟨j, hj, k, hk, by
                intro hlog
                apply hjk
                calc
                  z j = exp (log (z j)) := (exp_log (hzpos j hj)).symm
                  _ = exp (log (z k)) := by rw [hlog]
                  _ = z k := exp_log (hzpos k hk)⟩
            have hlt :=
              strictConvexOn_exp.map_sum_lt hw hw' (fun i _ => Set.mem_univ <| log (z i)) hlog
            simp only [exp_sum, smul_eq_mul, mul_comm (w _) (log _)] at hlt
            have hlt' : ∏ i ∈ s, z i ^ w i < ∑ i ∈ s, w i * z i := by
              convert hlt using 1 <;> [apply prod_congr rfl; apply sum_congr rfl] <;> intro i hi
              · exact rpow_def_of_pos (hzpos i hi) _
              · rw [exp_log (hzpos i hi)]
            rw [h] at hlt'
            exact (lt_irrefl _ hlt').elim
          · intro j hj
            rw [arith_mean_weighted_of_constant s w z (z j) hw'
              fun i hi _ => by
                by_contra hij
                exact hne ⟨i, hi, j, hj, hij⟩]
      · intro h
        exact geom_mean_eq_arith_mean_weighted_of_constant s w z (∑ i ∈ s, w i * z i)
          (fun i hi => le_of_lt (hw i hi)) hw' hz fun i hi _ => h i hi
