        - norm_deriv_le_of_forall_mem_sphere_norm_le_positive_v1
        - norm_deriv_le_of_forall_mem_sphere_norm_le_missing_sphere_bound_negative_v1
      negative_control: missing sphere-bound bridge for the derivative norm route
      check: Keep the ball-domain differentiability, sphere-bound, and derivative norm witnesses explicit; preserve the exact Liouville norm-derivative bound theorem application and do not collapse the route into a generic continuity estimate.
