[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztare"
version = "1.2.4"
description = "ZTARE: zero-trust workbench for generating, stress-testing, and auditing research and project claims"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daniel Alami" }]
keywords = [
  "zero-trust",
  "claim-generation",
  "claim-auditing",
  "claim-governance",
  "agent-evaluation",
  "research-agents",
  "research-kernel",
  "deterministic-gates",
  "audit-trails",
  "symbolic-regression",
  "lean-proofs",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "sympy>=1.14",
  "z3-solver>=4.13.4,<4.15.5",
]

[project.optional-dependencies]
lean = [
  "scipy>=1.14",
  "cvc5>=1.2",
  "cvxpy>=1.4",
  "numpy>=2.0",
]
research = [
  "scipy>=1.14",
  "cvc5>=1.2",
  "cvxpy>=1.4",
  "sentence-transformers>=5.0",
  "hdbscan>=0.8.40",
  "umap-learn>=0.5.10",
  "numpy>=2.0",
  "networkx>=3.5",
  "pandas>=2.0",
  "matplotlib>=3.10",
  "mpmath>=1.3",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "cryptography>=42.0",
  "jsonschema>=4.0",
  "requests>=2.30",
  "tenacity>=8.0",
  "tqdm>=4.60",
  "click>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
]
google = [
  "google-genai>=1.0.0",
]
anthropic = [
  "anthropic>=0.25.0",
]
openai = [
  "openai>=1.0.0",
]
providers = [
  "google-genai>=1.0.0",
  "anthropic>=0.25.0",
  "openai>=1.0.0",
]
ui = [
  "streamlit>=1.30",
]
full = [
  "scipy>=1.14",
  "cvc5>=1.2",
  "cvxpy>=1.4",
  "sentence-transformers>=5.0",
  "hdbscan>=0.8.40",
  "umap-learn>=0.5.10",
  "numpy>=2.0",
  "networkx>=3.5",
  "pandas>=2.0",
  "matplotlib>=3.10",
  "mpmath>=1.3",
  "pydantic>=2.0",
  "python-dotenv>=1.0.0",
  "cryptography>=42.0",
  "jsonschema>=4.0",
  "requests>=2.30",
  "tenacity>=8.0",
  "tqdm>=4.60",
  "click>=8.0",
  "rich>=13.0",
  "httpx>=0.27",
  "google-genai>=1.0.0",
  "anthropic>=0.25.0",
  "openai>=1.0.0",
  "streamlit>=1.30",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/sparckix/ztare"
Source = "https://github.com/sparckix/ztare"

[project.scripts]
ztare = "ztare.cli:main"
leanmill = "ztare.leanmill.cli:main"
ztare-calibration-stats = "ztare.forecasting.calibration_stats:main"
ztare-calibration-db = "ztare.forecasting.calibration_db:main"

[tool.pytest.ini_options]
markers = ["slow: real end-to-end member run (~250s); skipped in fast CI"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ztare*"]
