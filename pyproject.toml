[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ztare"
version = "0.1.0"
description = "ZTARE: zero-trust adversarial validation for claims, theses, and strategic logic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Alami" }]
keywords = [
  "adversarial-reasoning",
  "scientific-validation",
  "deterministic-gates",
  "symbolic-regression",
  "lean-proofs",
  "research-engine",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-genai>=1.0.0",
  "anthropic>=0.25.0",
  "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/sparckix/ztare"
Source = "https://github.com/sparckix/ztare"

[project.scripts]
ztare = "ztare.cli:main"
ztare-calibration-stats = "ztare.forecasting.calibration_stats:main"
ztare-calibration-db = "ztare.forecasting.calibration_db:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ztare*"]
