# ZTARE Architecture-Index Edge Graph
#
# The genuinely-novel meta-graph layer over the flat capability catalog at
# `analytics/public/index/architecture_index.jsonl`. RAG-MCP / Voyager / Anthropic Skills
# ship FLAT indexes (capability + triggers + description). This file adds the
# typed edges that make a Director able to traverse from a capability to:
#   - the seams it has discharged
#   - the gateposts (GP-IDs) it operates on
#   - the OKRs it advances (`org/key_results/*`)
#   - the catch-ledger entries (`analytics/public/ledgers/catch/catch_ledger.jsonl`) it surfaced
#   - other capabilities it composes-with
#
# Edge types:
#   discharges_seam:   capability id -> seam path
#   operates_on_gp:    capability id -> GP-ID (in `docs/internal/repo_audits/gp_index.tsv`)
#   advances_okr:      capability id -> OKR path under `org/key_results/`
#   surfaced_catch:    capability id -> catch_id in `analytics/public/ledgers/catch/catch_ledger.jsonl`
#   composes_with:     capability id -> capability id (symmetric in spirit;
#                      list one direction here, traversal is undirected)
#
# Coverage policy: edges are AUTHORITATIVE for impact-4 and impact-5
# capabilities (the critical tier). Lower tiers seed only obvious edges;
# do not back-fill speculative composes_with for impact-1/0 entries.
#
# Maintenance: append-only by default. When a capability becomes decision-critical
# way and discharges a seam OR surfaces a catch, append an edge here AND bump
# `impact_factor_expost` in `analytics/public/index/architecture_index.jsonl`. This is the
# wiring that lets the discoverability test (Clay-closure 2026-05-08) prove
# the index recommends capabilities BEFORE the operator prompts for them.

