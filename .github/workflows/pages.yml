name: Deploy analytics dashboard to GitHub Pages

# Builds the analytics dashboard through the LEAK-GATED safe-build (publish_mask + fail-closed
# leak assertion run in CI — a leaky build fails the job and publishes nothing) and deploys the
# single self-contained dist/index.html as the Pages site. Manual + on dashboard/data changes.
on:
  push:
    branches: [main]
    paths:
      - 'analytics/public/dashboard/**'
      - 'analytics/public/queries/**'
      - 'analytics/public/ledgers/reflexive/p0_metrics.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dashboard deps
        working-directory: analytics/public/dashboard
        run: npm ci
      - name: Safe build (publish_mask + fail-closed leak assertion)
        working-directory: analytics/public/dashboard
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: analytics/public/dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
