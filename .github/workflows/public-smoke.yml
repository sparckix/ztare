name: public-smoke

on:
  push:
  pull_request:

jobs:
  offline-public-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run public first-run path
        run: make first-run PYTHON=python
