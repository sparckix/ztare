# Orchestration menu v2 (true v2).
#
# Reconciled against the 96-dispatch deployment ledger and the 31-pattern
# catalog (RD pattern self-audit, 2026-05-21). Every one of the 31 patterns is
# wired to at least one deployment path — nothing is orphaned, nothing retired.
#
# Structure per problem class:
#   default_chain : the 3-4 highest-deployment patterns — the spine
#   applicable    : other patterns that declare this class — available, not default
# Plus always_on (cross-cutting), meta_layer (apparatus-architecture patterns),
# and one unassigned defect (PATTERN-027 declares no problem_class).
#
# Pattern frequencies in (parens) are deployments across the 96-dispatch ledger.
# "0" = unwired, never surfaced by the old menu — kept and now wired; a fair
# post-wiring trial (see CANDIDATE_unwired_patterns.md) governs any future
# retirement, never frequency-under-broken-wiring.
#
# H31-H36 update (2026-05-24): the menu is no longer treated as a label
# prompt. Evidence supports a compiler contract: model/RD proposes a residual
# class, source-cue checks accept/refuse it, accepted class lowers to a compact
# action_program + current_action_index + required_next_action, and detailed
# cue receipts stay in audit metadata. Closed-menu forcing is unsafe: if no
# source-supported class matches, emit outside_menu and hand off to a specific
# new residual-class candidate instead of forcing a known research-evidence
# class. H37-H39 add two guards: generic outside routing is weaker than naming
# the specific outside residual, and wrong compact contracts must pass
# source-contract alignment before execution. H40-H42 add two refinements:
# corrected end-to-end architecture works on synthetic external-style rows;
# outside-specific expansion should be known-class-first/two-stage because a
# flat expanded class list hurt in-menu accuracy; and subtle wrong contracts
# need program-order / stop-condition checks, not source alignment alone. H44
# replayed those wrong contracts through a deterministic invariant checker and
# caught 12/12 wrong contracts with 0/12 false blocks on correct contracts. The
# menu remains advisory until production shadow traces validate uplift.

version: 0.2.4
spec_version: 1
reconciled_at: 2026-05-21
compiler_policy_updated_at: 2026-05-24
compiler_policy_revision: H47_shadow_outside_expansion
pattern_count_wired: 31

open_set_policy:
  class_id: outside_menu
  description: no source-supported known menu class matches; do not force a closed-class route.
  action_program:
    - defer_to_new_residual_class
    - stop_or_repair
  required_receipts:
    - known_class_first_check
    - open_set_refusal_status
    - specific_outside_residual_class
    - new_residual_class_candidate
    - rejected_nearest_known_class
    - source_cue_check_status
  evidence_basis: H36_H37_open_set_checked_compiler_positive

compiler_contract_policy:
  active_controller_surface:
    - accepted_residual_class
    - source_cue_check_status
    - action_program
    - current_action_index
    - required_next_action
    - program_counter_rule
    - open_set_refusal_status
  invariant_gate: src/ztare/research_director/orchestration_contract_gate.py
  outside_expansion_enforcement: shadow_only_until_drift_detector_evidence
  shadow_log: src/ztare/research_director/orchestration_shadow_log.py
  audit_surface:
    - requested_residual_class
    - selected_residual_edge
    - rejected_nearest_confuser_edge
    - edge_source_evidence
    - source_cue_receipts_ref
    - missing_source_cues_ref
    - known_class_first_check
    - source_contract_alignment_check
    - wrong_contract_repair_or_refusal
    - deterministic_lowering_result
    - program_order_check
    - stop_condition_check
  disallowed_modes:
    - free_form_program_synthesis
    - class_only_control
    - closed_menu_forcing
    - unchecked_wrong_contract_execution
  evidence_basis: H31_H32_H33_H34_H35_H36_H37_H38_H39_H40_H41_H42_H44_H47

problem_classes:

  hard_mathematical_residual:
    description: open mathematical content is opaque / not localized.
    triggers:
      lexical: [residual, conjecture-open, vague-class, can-not-localize]
      structural: [theorem_statement_unsharp, residual_class_described_in_prose]
    default_chain:
      - PATTERN-014   # cold_shot_dispatch        (32)
      - PATTERN-001   # friction_debate           (20)
      - PATTERN-002   # darwin_idea_killer        (10)
      - PATTERN-008   # three_leg_verification    (10)
    applicable:
      - PATTERN-011   # swarm_dispatch            (2)
      - PATTERN-023   # anti_rename_charter_gate  (1)
      - PATTERN-025   # gowers_first_formalize_second (0, newly wired)
      - PATTERN-028   # recursive_tool_depth_loop (0, newly wired)
      - PATTERN-024   # scientific_amnesia_precheck (0, newly wired)

  pre_category_emergence:
    description: independent frames converging; name the unifier or kill premature naming.
    triggers:
      lexical: [convergent-traditions, unifier-needed, vocabulary-saturation]
      structural: [multiple_independent_frames_same_conclusion, naming_sprint_proposed]
    default_chain:
      - PATTERN-005   # falsifiable_asymmetry     (34)
      - PATTERN-014   # cold_shot_dispatch        (32)
      - PATTERN-001   # friction_debate           (20)
    applicable:
      - PATTERN-010   # business_framing          (2)
      - PATTERN-011   # swarm_dispatch            (2)
      - PATTERN-003   # reducer                   (1)
      - PATTERN-004   # vocabulary_quarantine     (0, newly wired)

  apparatus_self_audit:
    description: a claim or build looks suspect; audit own claims.
    triggers:
      lexical: [audit-required, catch-rate-rising, suspect-claim, apparatus-laundering]
      structural: [N_axioms_added_recently, no_external_validation_yet]
    default_chain:
      - PATTERN-012   # prediction_ledger         (25)
      - PATTERN-001   # friction_debate           (20)
      - PATTERN-022   # bundle_discriminator_stack(20)
      - PATTERN-002   # darwin_idea_killer        (10)
    applicable:
      - PATTERN-007   # smuggling_audit           (7)
      - PATTERN-009   # independent_cas_verification (5)
      - PATTERN-013   # pattern_deployment_ledger (4)
      - PATTERN-006   # tautology_trap_detector   (2)
      - PATTERN-003   # reducer                   (1)
      - PATTERN-026   # primitive_before_architecture_gate (0, newly wired)
      - PATTERN-024   # scientific_amnesia_precheck (0, newly wired)

  pure_analysis_drift:
    description: prose reasoning has lost numeric grounding.
    triggers:
      lexical: [no-numerics-recently, all-prose, drift-suspected]
      structural: [consecutive_iterations_without_cas_run]
    default_chain:
      - PATTERN-009   # independent_cas_verification — design intent: run FIRST
      - PATTERN-008   # three_leg_verification    (10)
      - PATTERN-007   # smuggling_audit           (7)
    applicable:
      - PATTERN-010   # business_framing          (2)

  too_complex_direct_attack:
    description: scope exceeds one iteration; miniaturize or stratify.
    triggers:
      lexical: [too-complex, miniature-needed, stratify, divide-and-conquer]
      structural: [problem_scope_exceeds_iteration_budget]
    default_chain:
      - PATTERN-022   # bundle_discriminator_stack(20)
      - PATTERN-013   # pattern_deployment_ledger (4)
      - PATTERN-011   # swarm_dispatch            (2)
    applicable:
      - PATTERN-025   # gowers_first_formalize_second (0, newly wired)
      - PATTERN-024   # scientific_amnesia_precheck (0, newly wired)
      - PATTERN-028   # recursive_tool_depth_loop (0, newly wired)

# Cross-cutting standing discipline — not routed, run on every substrate.
always_on:
  - PATTERN-015   # eigenquestion_phrasing_discipline (34)
  - PATTERN-018   # structural_residual_analogy       (3)

# Patterns about the apparatus's own architecture, not a research problem
# class. Invoked by the meta-architecture layer / RD self-review, not a chain.
meta_layer:
  - PATTERN-016   # frontier_co_drive_protocol         (0, newly wired)
  - PATTERN-017   # frontier_state_ledger              (0, newly wired)
  - PATTERN-019   # adaptive_eigenquestion_generation  (1, candidate)
  - PATTERN-020   # meta_arc_stall_resolution          (0, newly wired)
  - META-PATTERN-021  # cross_layer_alignment_failure
  - META-PATTERN-022  # gowers_first_with_content_layer_composition
  - META-PATTERN-023  # multi_scope_pattern_application
  - META-PATTERN-024  # recursive_fixed_point_convergence

# Defect surfaced by the audit: PATTERN-027 declares NO problem_class, so it
# cannot be wired. It must be assigned a problem_class (operator action) or
# explicitly marked cross-cutting; until then it is unreachable by design.
unassigned_defect:
  - PATTERN-027   # terminal_de_anonymization_reformulation — needs a problem_class

flexibility_clause: |
  The Research Director MAY deviate; document deviation in the F-row. A
  recurring deviation is a signal to re-run rd_pattern_audit (the standing
  reconciliation loop), not to silently grow the menu.

reconciliation: |
  This menu is kept honest by a recurring audit (rd_pattern_audit) that
  re-derives chains from the deployment ledger and flags drift. See the
  routine_reviews port (CANDIDATE_routine_reviews_port.md) for the schedule.
