      aliases: [beale-kato-majda, vorticity-sup-integral]
      note: ∫‖∇×u‖_∞ dt < ∞ on every finite window.
    - id: PSL_global_extension
      aliases: [ladyzhenskaya-prodi-serrin, spacetime-LpLq]
      note: Prodi-Serrin Lᵖ_tLq_x criterion.
    - id: ESS_global_extension
      aliases: [escauriaza-seregin-sverak, L3-endpoint, ESSL3]
      note: L^∞_t L³_x boundedness.
    - id: BdV_global_extension
      aliases: [beirao-da-veiga, gradient-shell]
      note: velocity-gradient Lᵖ_tLq_x criterion.
    - id: CF_global_extension
      aliases: [constantin-fefferman, vorticity-direction-lipschitz,
                strict-margin-perennial-atom, strict_margin,
                opaque-subcriticality, super-typeI, krz-leaf-b,
