    - id: C7_viscous_alignment_surplus
      aliases: [C7, viscous-alignment-surplus, viscous alignment surplus,
                A_visc, avisc, localized-viscous-alignment-surplus,
                positive-viscous-alignment-surplus, cv-stretching-source,
