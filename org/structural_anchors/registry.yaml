# GP-238 STRUCTURAL-ANCHOR REGISTRY (parts 1-2 of the substrate-
# agnostic generalization). GENERIC FORMAT, SUBSTRATE-SPECIFIC CONTENT.
#
# Each substrate declares its small set of route-invariant residual
# targets / irreducible open atoms. The GP-241 daemon-minted signed
# start_tick contract REQUIRES every tick to NAME which residual_target
# it addresses (registry-membership-checked) or carry a structured
# new_target_justification. This is the NS basin HARD RULE generalized
# out of one project's entrypoint into the generic contract.
#
# NOTE: the Rung-2 vocabulary-independent op_fingerprint near-duplicate
# auto-check was FALSIFIED on the NS 6-rediscovery leave-one-out
# ship-gate (recall 5/6 but 9/20 false positives — unrelated NS files
# scored higher than true siblings). It therefore does NOT ship. Parts
# 1-2 (registry + name-the-target forcing rule) are independent of that
# falsified mechanism and are what is implemented. Unregistered targets
# are flagged for human/operator audit, not fingerprint-adjudicated.
#
# Schema:
#   <substrate>:
#     source_ref: <path>            # authoritative anchor doc (by
#                                   # reference — NEVER forked here)
#     anchor_visit_required: <path> # OPTIONAL: a structural-anchor
#                                   # source file the pretick basin
#                                   # traversal MUST have visited
#                                   # (pretick_runner step 9 enforces
#                                   # generically; omit ⇒ not required)
#     gate_guard_sources:           # OPTIONAL: substrate-specific
#       relapse_fingerprint:        # data copied into the root-owned
#         - <path>                  # VPS gate tree by deploy/configured_
#                                   # gate_sources.py; vps_sync_files.txt
#                                   # stays generic and never lists
#                                   # per-tick artifacts.
#     vps_sync_sources:             # OPTIONAL: active-substrate files
#       - <path>                    # synced to the agent repo on the VPS
#                                   # by deploy/configured_gate_sources.py;
#                                   # not copied into the root-owned gate
#                                   # tree unless also listed above.
#     targets:
#       - id: <stable id>
#         aliases: [<known re-vocabularizations>]
#         note: <one line>

schema_version: 1

ns_millennium_hunt:
  source_ref: projects/ns_millennium_hunt/workspace/AMNESIA_BASIN_ENTRYPOINT.md
  anchor_visit_required: ztare_proofs/ZtareProofs/ns_trackb_FINAL_THEOREM.lean
  gate_guard_sources:
    relapse_fingerprint:
      - projects/ns_millennium_hunt/workspace/ns_residual_manifest.md
  vps_sync_sources:
