# ── PRIORITY MODEL (versioned, correctable) ─────────────────────────
# This is the bidirectional legibility artifact (GP-167 Turn 3,
# Alien 2040 recommendation). Agents read this the same way they
# read their mandate. The human's preferences are a first-class
# object, not inferred from sparse signals.

priorities:
  - rank: 1
    area: scientific_discovery
    description: >
      Scientific progress via ZTARE — real-world discovery substrates,
      recursive improvement of the apparatus, and publishable findings.
      Currently: gp163d acceleration interpolation, Discovery Engine
      triad validation, grammar ceiling research.
    weight: 0.6

  - rank: 2
    area: org_design_evolution
    description: >
      Symbiotic human-AI organizational design — M-form evolution,
      governance kernel as product, persistent autonomous agents,
      multi-agent coordination, enterprise scaling.
    weight: 0.3

  - rank: 3
    area: paper_publication
    description: >
      Paper 5 (Epistemic Verification treatise) and Paper 4 (Cognitive
      Firm) completion and submission. Papers are downstream of
      discoveries — don't prioritize paper polish over new findings.
    weight: 0.1

# ── DECISION PREFERENCES ────────────────────────────────────────────

decision_thresholds:
  auto_approve_cost_usd: 5.00      # below this, just do it
  auto_approve_if_preregistered: true  # sealed experiments auto-approve
  always_escalate:
    - "paper submission"
    - "mandate modification"
    - "new role creation"
    - "budget increase"
    - "public claim about discovery"

# ── ATTENTION MODEL ─────────────────────────────────────────────────

attention:
  available_hours_per_day: 3        # realistic governance time
  preferred_review_times:
    - "morning (08:00-10:00 ET)"
    - "evening (20:00-22:00 ET)"
  max_interrupts_per_day: 8
  silence_timeout_minutes: 30       # after 30 min no response:
  silence_policy: "defer_to_next_tick"  # don't auto-approve, don't escalate louder

# ── COMMUNICATION PREFERENCES ──────────────────────────────────────

communication:
  primary_device: "laptop"          # governs from laptop, checks phone for alerts
  secondary_device: "phone"
  notification_channel: "telegram"  # read-only pager for critical signals
  governance_channel: "dashboard"   # approve/direct/review from dashboard
  style: "plain_english_mungerian"  # Charlie Munger standard, no jargon
  pet_peeves:
    - "long summaries of what just happened (can read the diff)"
    - "asking permission for things within mandate"
    - "epistemic arrogance (declaring results before they're proven)"
    - "ceremony that assumes a team (solo operator)"

# ── CONTEXT RECONSTRUCTION ──────────────────────────────────────────
# What the principal wants to see when returning after a break
# (Nardi's return-to-work summary)

return_to_work:
  first_question: "what broke or needs me?"
  second_question: "what's the best result since I last checked?"
  third_question: "what decisions are waiting?"
  format: "3 bullet points max, then I'll drill in"

# ── RISK TOLERANCE ──────────────────────────────────────────────────

risk:
  experiment_budget_comfort: 50.00   # per experiment, comfortable
  experiment_budget_pause: 100.00    # pause and ask
  false_positive_tolerance: "low"    # would rather miss a finding than claim a fake one
  false_negative_tolerance: "medium" # okay with null results if honest
  public_claim_bar: "confirmed_cross_family"  # won't claim in paper until cross-mutator validated
