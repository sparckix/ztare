# Substrate portfolio registry — read by
# `src/ztare/research_director/substrate_portfolio.py` (BRIDGE-3).
#
# Adding a substrate to the portfolio is a YAML edit, not a code edit.
# Each entry declares a substrate slug + the eigenquestion class it
# explores + whether the project + rubric files are already authored.
#
# Order matters when running the full portfolio sequentially: each
# substrate's run feeds the cross-substrate exclusion ledger (rubric
# spec §25) the next substrate reads. Put the most-mature / highest-
# signal substrates first so downstream members see a populated ledger.
#
# Schema:
#   members:
#     - slug: <project slug under projects/>
#       eigenquestion_summary: <one-line>
#       primary_mechanism_family: <bias the substrate steers toward>
#       scaffolded: <true if charter + rubric are already authored>
#       opened_date: <ISO date>
#       opened_by: <principal | rd | claude | codex | ...>
#       notes: <optional free-form>

schema_version: 1
last_updated: "2026-05-07"

members:
