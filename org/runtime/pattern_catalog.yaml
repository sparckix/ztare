      \ Construction, Proof-Surface Compression,\n    Distribution/Tail Upgrade; plus\
      \ Candidate G Representation/Coordinate Reformulation.\n  - Universal v5 ops\
      \ (18): Problem Reformulation & Reduction, Generalization &\n    Abstraction,\
      \ Decomposition & Recomposition, Local-to-Global Assembly, etc.\nRunning this\
      \ pattern WITHOUT consulting the content layer is a recurring meta-failure\n\
