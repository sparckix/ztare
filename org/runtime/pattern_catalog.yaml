  META-PATTERN-023:
    source_file: org/patterns/multi_scope_pattern_application.md
    id: META-PATTERN-023
    name: multi_scope_pattern_application
    version: 1
    status: active
    discovered: 2026-05-15
    discovered_reason: "NS Clay closure session 2026-05-15: after operator-prompted\
      \ minting of\nMETA-PATTERN-022 (gowers_first_with_content_layer_composition\
      \ fixing the\ntool-not-consulted laundering between org/patterns and universal-language\n\
      JSONL), the operator forwarded GPT-5.5's parallel A/B attack on the same\nPDE\
      \ residual.\n\nGPT-5.5 produced FOUR substantive catches I had missed despite\
      \ having access\nto the same catalogs:\n  1. Premature Reynolds-defect framing-kill\
      \ (META-PATTERN-021 catch at\n     CHAIN scope: L\u2081 \"approximating sequence\
      \ Reynolds defect\" \u2260 L\u2082\n     \"blowup weak limit Reynolds defect\"\
      ).\n  2. Wrong local norm (parabolic L^3 vs spatial L^3 for Kim-Kozono\n   \
      \  threshold comparison \u2014 chain-scope norm choice, not local-scope\n  \
      \   dimension check).\n  3. Strategic pivot from \"FullInvisibilityForcesRegularity\"\
      \ to\n     \"LocalL3LargeTypeIForcesVisibility\" \u2014 Proof-Surface Compression\n\
      \     at GLOBAL proof-obligation scope.\n  4. Premature Lean encoding (tick508/509\
      \ shipped before recursion\n     stabilized \u2014 META-PATTERN-022 binding\
      \ rule violated at recursive\n     scope).\n\nDiagnosis: I was applying META-PATTERN-022's\
      \ composition only at LOCAL\nstep scope. Every catch GPT-5.5 made was REACHABLE\
      \ via the same catalog\nbut lives at chain / recursive / meta scope. Composing\
      \ the two catalogs\nis necessary but not sufficient; the composition must run\
      \ at every scope\nof the proof structure.\n\nOperator: \"maybe this deserves\
      \ a meta pattern as well\". Minted as\nMETA-PATTERN-023 to crystallize the multi-scope\
      \ application discipline.\n"
    triggers:
      lexical:
      - applied_pattern_at_one_scope_only
      - per_step_verified_but_chain_not_verified
      - recursion_did_not_stabilize_but_encoded
      - sub_chain_not_audited_with_same_patterns
      structural:
      - META_PATTERN_022_composition_applied_at_local_scope_only
      - chain_level_load_bearing_piece_unaudited
      - recursive_sub_chain_pattern_application_skipped
      - meta_scope_failure_modes_not_examined
      problem_classes:
      - hard_mathematical_residual
      - pde_chain_closure
      - recursive_proof_obligation_audit
    application_scopes:
      local:
        description: 'Each transition step in a multi-step argument. ANTI-PATTERN-012''s

          6-point per-step verification (form / direction / quantifier /

          domain / dimension / inclusion). The smallest scope; necessary

          but not sufficient.

          '
        pattern_examples:
        - ANTI-PATTERN-012 per-step verification
        - Universal-language ops at single derivation step
      chain:
        description: 'The OVERALL chain structure. Questions at this scope: is this
          the

          right chain to be running? what''s the chain''s load-bearing piece?

          do all links use the SAME interpretation of key objects (avoiding

          META-PATTERN-021 cross-layer drift)?

          '
        pattern_examples:
        - META-PATTERN-021 applied to chain-internal layer drift
        - Proof-Surface Compression at full-chain scope
        - PATTERN-007 smuggling_audit on the chain's vocabulary as a whole
      recursive:
        description: 'When sub-chains or sub-obligations arise (e.g., the chain

          decomposes into a tree of nested obligations). At this scope:

          apply the SAME patterns to each sub-chain; check the recursion has

          STABILIZED before encoding in Lean (per META-PATTERN-022 binding

          rule). Encoding before stabilization produces premature scaffolds.

          '
        pattern_examples:
        - META-PATTERN-022 reapplied on each sub-chain
        - PATTERN-024 scientific_amnesia_precheck on sub-obligation
        - Recursive depth budget + stabilization criterion
      meta:
        description: 'Failure modes that only appear when applying patterns across

          scopes. Examples: a META-PATTERN-021 cross-layer mismatch between

          sub-chain and parent-chain interpretations of an object; a

          vocabulary smuggle that''s invisible at local scope but visible

          at chain scope.

          '
        pattern_examples:
        - "cross-scope META-PATTERN-021 (sub-chain L\u2081 vs chain L\u2082)"
        - tool-not-consulted laundering at recursive scope (consulting catalog at
          local steps only, skipping at chain reformulation)
        - this META-PATTERN-023 itself (a meta-scope catch about the scope-application
          discipline)
    binding_rule: "Every non-trivial PDE chain MUST be audited at all four scopes\n\
      before shipping a closure claim or Lean encoding:\n  1. Local scope:  ANTI-PATTERN-012\
      \ 6-point per-step verification.\n  2. Chain scope:  is this chain the right\
      \ one? load-bearing piece\n                   named explicitly? cross-layer\
      \ alignment checked\n                   for all key objects?\n  3. Recursive\
      \ scope:  has the recursion stabilized? are sub-chains\n                   \
      \    independently audited at the chain scope?\n  4. Meta scope:  any cross-scope\
      \ failure modes (e.g., sub-chain\n                  cross-layer drift) examined?\n\
      \nFailing any single scope is sufficient to invalidate the closure\nclaim, even\
      \ if the other scopes pass.\n"
    chain_position: precondition
    sessional_catches:
    - tick508_premature_lean_scaffolding_before_recursion_stabilized
    - tick509_parabolic_vs_spatial_L3_norm_choice_unaudited_at_chain_scope
    - route_A_premature_framing_kill_aubin_lions_at_chain_scope
    - missing_strategic_pivot_to_visibility_completeness_at_global_scope
    GPT55_comparison_evidence: 'In a controlled comparison (same PDE residual, same
      catalog access, same

      session time-budget), GPT-5.5 produced 4 catches I missed. All 4 were

      reachable via the catalog I had; all 4 lived at chain / recursive /

      meta scope where I had applied patterns only at local scope. This is

      empirical evidence for the meta-pattern''s discriminating value.

      '
    references:
    - META-PATTERN-022 gowers_first_with_content_layer_composition (composition of
      two catalogs)
    - META-PATTERN-021 cross_layer_alignment_failure (sibling: cross-layer at single
        scope)
    - ANTI-PATTERN-012 vocabulary_chain_laundering (local-scope per-step verification)
    - "feedback_be_meta_darwin_to_self_2026_05_14.md (load-bearing user-memory \u2014\
      \ multi-scope rule added 2026-05-15)"
    - docs/reference/structural_language_catalog.json (content layer)
    falsifiable_test: 'Once wired as a precondition on closure-claim artifacts, over
      N>=15 closure

      claims, artifacts carrying documented verification at all four scopes (local
      /

      chain / recursive / meta) must be subsequently overturned by a cold-shot or

      Meta-Darwin audit in <=15% of cases, versus a matched baseline of closure claims

      verified at local scope only; the four-scope overturn rate must be at least
      30

      percentage points below the local-only baseline (motivated by the 2026-05-15
      A/B

      comparison where GPT-5.5 produced 4 chain/recursive/meta-scope catches the

      local-only pass missed). If four-scope-verified closures are overturned at >15%,

      or within 30 points of the local-only baseline, the extra scopes catch nothing

      and the meta-pattern demotes.

      metric_source: closure-claim artifacts (F-rows / Lean files) with four-scope

      verification notes, joined to subsequent overturn events in

      external_prover_ledger.jsonl and catch_ledger.jsonl; matched local-only controls

      from pre-wiring closure claims.

      '
    last_reviewed: 2026-05-22
    review_due: 2026-06-21
    review_cadence: per_campaign_summary
  PATTERN-001:
    source_file: org/patterns/pattern_1_friction_debate.md
    id: PATTERN-001
    name: friction_debate
    version: 1
    status: active
    discovered: 2026-05-08
    triggers:
      lexical:
      - debate
      - dialectic
      - two-sides
      - conflict
      - ambiguous
      - contested
      structural:
      - conflicting_evidence
      - decision_under_uncertainty
      - prior_verdicts_disagree
      problem_classes:
      - hard_mathematical_residual
      - pre_category_emergence
      - apparatus_self_audit
    spawn:
      mode: sequential_friction
      rounds: 5
      subagents:
      - role: champion_exist
        description: Argues the proposition exists / construction succeeds / theorem
          holds
        tools:
        - read
      - role: champion_nonexist
        description: Argues nothing exists / construction fails / theorem false
        tools:
        - read
      - role: arbiter
        description: Synthesizes Round-5 joint verdict + tightens theorem statement
        tools:
        - read
        - write_verdict
    output_schema: friction_verdict_v1
    fallback: PATTERN-002
    preconditions:
    - construction_freedom: at least one champion can attempt explicit construction
    - orthogonal_pressure_since_last_run: prior iteration was NOT another Pattern-1
        on same residual
    - recursion_depth: 0_or_1
    deployment_rules:
    - rule_1_construction_freedom: verify at least one champion has freedom before
        spawning
    - rule_2_orthogonal_pressure: at least one orthogonal pattern between Pattern-1
        iterations
    - rule_3_recursion_depth: "\u22642 consecutive Pattern-1 on same residual"
    - rule_4_10x_criteria: "output must meet \u22651 of {compiled_constructor, compiled_falsifier,\
        \ residual_split, executable_test, promotion_gate} or downgrade to review-note"
    - rule_5_top_of_funnel: question must be FRESH, not residual-grinding
    - rule_6_pre_spec_locked_before_deployment: pre-registration file (criteria +
        verdict alphabet + scoring rule) MUST exist as a committed git artifact BEFORE
        the first agent dispatch. Operator must record `pre_spec_sha` (full commit
        hash) in the orchestration_state directory before round_1.json is written.
        If `pre_spec_sha` is empty, missing, or points to a commit timestamped AFTER
        the earliest agent dispatch log entry, the deployment is automatic INSUFFICIENT_EVIDENCE
        on all criteria. No retroactive pre-spec.
    - rule_7_verdict_alphabet_locked: verdicts MUST be drawn from the fixed alphabet
        `{PASS, FAIL, PARTIAL, INSUFFICIENT_EVIDENCE}`. Compound qualifiers ("STRONG
        WEAK PASS", "GENUINE PASS", "PROVISIONAL PARTIAL"), charity grades, and any
        new label coined during scoring are automatic INSUFFICIENT_EVIDENCE for the
        affected criterion AND a catalog-level catch under ANTI-PATTERN-007. The arbiter
        has no authority to extend the alphabet mid-debate.
    - rule_8_criteria_locked_before_dispatch: the criteria set (the list of disjoint
        questions the joint verdict will answer) MUST be enumerated, frozen, and committed
        inside the pre-spec file referenced by `pre_spec_sha`. Adding, removing, refining,
        or re-weighting criteria after the first agent dispatch is automatic INSUFFICIENT_EVIDENCE
        on the changed criteria AND requires a new pre_spec_sha + a new deployment
        id (the prior deployment is closed). Criterion drift is not "tightening".
    chain_position: primary
    related_patterns:
    - PATTERN-002 (darwin_idea_killer, chained on output)
    - PATTERN-008 (three_leg_verification, chained on theorem output)
    references:
    - https://arxiv.org/abs/2402.06782 (Khan et al. 2024, closest published analog)
    - https://arxiv.org/html/2603.27404v1 (Heterogeneous Debate Engine, Mar 2026)
    falsifiable_test: 'Across N>=15 friction_debate deployments tagged in the pattern_deployment_ledger,

      the fraction whose Round-5 joint verdict is later overturned or downgraded by
      a

      chained PATTERN-002 / cross-family audit must be LOWER than the matched overturn

      fraction for single-perspective (non-debate) audit dispatches on comparable

      claims, by an absolute margin of >=15 percentage points. If friction-debate

      verdicts are overturned at a rate within 15 points of (or above)

      single-perspective verdicts, the friction loop adds no verification value and

      the pattern demotes.

      metric_source: pattern_deployment_ledger.jsonl (primary_pattern=PATTERN-001,

      outcome_bucket_pre_registered vs outcome_bucket_realized) cross-referenced with

      the catch ledger for overturn/downgrade events.

      '
    last_reviewed: 2026-05-22
    review_due: 2026-06-21
    review_cadence: per_campaign_summary
