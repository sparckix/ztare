  PATTERN-012:
    source_file: org/patterns/prediction_ledger.md
    id: PATTERN-012
    name: prediction_ledger
    version: 2
    status: active_conditional
    discovered: 2026-05-08
    promoted: 2026-05-09
    meta_meta_audit: analytics/public/audits/META_META_DARWIN_PATTERN_012_2026_05_09.md
    auto_demote_tripwire: "2026-05-16 OR ledger N=20 \u2014 whichever comes first;\
      \ if validate_prediction_ledger.py is NOT wired into CI by then AND N<20 across\
      \ <2 substrates AND <2 predictors, status flips back to PILOT"
    triggers:
      lexical:
      - predict
      - estimate
      - odds
      - probability
      - timeline
      - will take
      - days
      - weeks
      - hours
      structural:
      - conditional_odds_assertion
      - effort_estimate
      - promotion_decision
      - pre_registration
      problem_classes:
      - apparatus_self_audit
      - calibration_drift
      - decision_under_uncertainty
    spawn:
      mode: inline_record
      rounds: 1
      subagents:
      - role: predictor
        description: Author the prediction. May be the operator, the Research Director,
          or a dispatched substrate agent.
        tools:
        - write
      - role: resolver
        description: "When the predicted event resolves (time passes / experiment\
          \ runs / agent returns), fill the resolution fields. Same predictor or different\
          \ \u2014 does not require a concurring-agent gate."
        tools:
        - write
    output_schema: prediction_ledger_row_v1
    fallback: PATTERN-008
    preconditions:
    - substantive_prediction: a prediction that gates a typed action (promotion, dispatch,
        kill, escalation). Idle predictions ("the weather might be sunny") are NOT
        logged.
    - effort_in_agent_units: effort estimates MUST be expressed in agent-minutes (or
        agent-hours), NOT human-hours. The operator-flagged calibration bug was systematic
        over-estimation by 8-12x using human-effort units.
    - pre_resolution_capture: row written BEFORE resolution. Backfilling a prediction
        after the result is known is automatic INSUFFICIENT_EVIDENCE on the calibration
        claim.
    deployment_rules:
    - rule_1_log_substantive_predictions: any prediction that gates a typed action
        gets a ledger row before the action commits.
    - rule_2_agent_minutes_not_human_hours: effort estimates in agent units. If you
        find yourself estimating in human-hours, that's the bug the pattern was designed
        to catch.
    - rule_3_resolve_when_resolved: when the predicted event resolves, fill `actual_outcome`,
        `actual_effort_minutes`, `calibration_delta_*` fields. Never edit prior fields.
    - rule_4_meta_darwin_audit: each resolution writes a `meta_darwin_audit` field
        naming any structural lessons (e.g., "predictor systematically under-confident
        on event_X").
    - rule_5_demotion_thresholds: "if predictors converge on Brier scores worse than\
        \ uniform after >=20 predictions, pattern is curve-fitting calibration \u2192\
        \ demote. If predictions get gamed (under-confident hedging to look calibrated)\
        \ \u2192 demote."
    chain_position: lateral
    related_patterns:
    - "PATTERN-005 (falsifiable_asymmetry \u2014 predictions are pre-registered falsifiers)"
    - "PATTERN-008 (three_leg_verification \u2014 applied to verdicts derived FROM\
      \ predictions)"
    - "ANTI-PATTERN-005 (narrative_inflation \u2014 predictions caught padded for\
      \ sentiment)"
    references:
    - 'Tetlock, Philip E. & Gardner, Dan (2015). Superforecasting: The Art and Science
      of Prediction. Crown.'
    - Brier, Glenn W. (1950). Verification of forecasts expressed in terms of probability.
      Monthly Weather Review.
    falsifiable_test: "After N>=20 resolved prediction-ledger rows across >=2 substrates\
      \ and >=2\npredictors, the aggregate Brier score on probabilistic predictions\
      \ must be\nstrictly better (lower) than a uniform/base-rate forecast by >=0.05,\
      \ AND mean\neffort-calibration error (predicted vs actual agent-minutes) must\
      \ be within 2x.\nIf Brier is no better than uniform, or effort estimates revert\
      \ to >2x systematic\nerror (the original ~10x bug returning), demote \u2014\
      \ this restates and quantifies\nthe pattern's own existing rule_5.\nmetric_source:\
      \ prediction_ledger.jsonl resolved rows (conditional_odds vs\nactual_outcome_bucket;\
      \ effort_estimate_agent_minutes vs actual_effort_minutes);\nBrier computed by\
      \ validate_prediction_ledger.py.\n"
    last_reviewed: 2026-05-22
    review_due: 2026-06-21
    review_cadence: per_campaign_summary
