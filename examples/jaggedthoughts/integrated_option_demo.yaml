schema: jaggedthoughts-profile-v1
profile_id: jaggedthoughts.demo.integrated-option
title: Integrated service-packaging decision
decision_question: Which packaging architecture remains non-dominated across the base case and a distribution disruption?
owner: Strategy team
as_of: "2026-08-08"

sources:
  - id: source.assumptions
    path: sources/demo_assumptions.md
    fetched_at: "2026-08-08T00:00:00Z"

evidence:
  - id: evidence.focused-demand
    source_id: source.assumptions
    excerpt: The focused segment has sufficient willingness to pay for a specialized offer.
  - id: evidence.broad-demand
    source_id: source.assumptions
    excerpt: The broad segment can be served without destructive dilution of the offer.
  - id: evidence.direct-capability
    source_id: source.assumptions
    excerpt: The organization can operate a direct channel at the required scale.
  - id: evidence.partner-control
    source_id: source.assumptions
    excerpt: Partner delivery preserves the required customer and pricing control.
  - id: evidence.subscription-retention
    source_id: source.assumptions
    excerpt: Subscription retention persists after a modeled competitor response.
  - id: evidence.usage-elasticity
    source_id: source.assumptions
    excerpt: Usage pricing remains attractive under modeled demand and cost volatility.
  - id: evidence.base-case-model
    source_id: source.assumptions
    excerpt: In the base case, arena, channel, and economic-logic contributions are additive except for the two explicitly declared complementarity bundles.
  - id: evidence.disruption-model
    source_id: source.assumptions
    excerpt: In the distribution-disruption case, partner control weakens while direct-channel control becomes more valuable.

grammar:
  id: jaggedthoughts.demo.integrated-option
  version: "1"
  target_type: StrategyOption
  max_depth: 1
  max_programs: 100
  terminals:
    - id: arena.focused
      type: Arena
      description: A narrow customer arena with concentrated needs.
      claims: [claim.external.focused-demand]
    - id: arena.broad
      type: Arena
      description: A broad customer arena with heterogeneous needs.
      claims: [claim.external.broad-demand]
    - id: channel.direct
      type: Channel
      description: Direct ownership of distribution and customer contact.
      claims: [claim.internal.direct-capability]
    - id: channel.partner
      type: Channel
      description: Distribution through an external partner system.
      claims: [claim.internal.partner-control]
    - id: economics.subscription
      type: EconomicLogic
      description: Recurring access pricing.
      claims: [claim.dynamic.subscription-retention]
    - id: economics.usage
      type: EconomicLogic
      description: Consumption-linked pricing.
      claims: [claim.dynamic.usage-elasticity]
  operators:
    - id: integrate-option
      inputs: [Arena, Channel, EconomicLogic]
      output: StrategyOption
      description: Build one integrated strategic option from three commitments.

claims:
  - id: claim.external.focused-demand
    kind: external
    text: The focused arena has sufficient willingness to pay.
  - id: claim.external.broad-demand
    kind: external
    text: The broad arena can be reached without destructive dilution.
  - id: claim.internal.direct-capability
    kind: internal
    text: The organization can operate a direct channel at the required scale.
  - id: claim.internal.partner-control
    kind: internal
    text: Partner delivery preserves the required customer and pricing control.
  - id: claim.dynamic.subscription-retention
    kind: dynamic
    text: Subscription retention persists after competitor response.
  - id: claim.dynamic.usage-elasticity
    kind: dynamic
    text: Usage pricing remains attractive under demand and cost volatility.

claim_dispositions:
  - claim_id: claim.external.focused-demand
    status: supported
    evidence_ref: evidence.focused-demand
  - claim_id: claim.external.broad-demand
    status: supported
    evidence_ref: evidence.broad-demand
  - claim_id: claim.internal.direct-capability
    status: supported
    evidence_ref: evidence.direct-capability
  - claim_id: claim.internal.partner-control
    status: supported
    evidence_ref: evidence.partner-control
  - claim_id: claim.dynamic.subscription-retention
    status: supported
    evidence_ref: evidence.subscription-retention
  - claim_id: claim.dynamic.usage-elasticity
    status: supported
    evidence_ref: evidence.usage-elasticity

evaluation:
  kind: factor_graph
  model_id: source-bound-factor-model-1
  landscape_mode: fixed
  evidence_epoch: "2026-08-08"
  objectives: [durable_value, strategic_control]
  aggregation: scenario_vector
  scenarios:
    - id: base_case
      weight: 0.5
      base: [0, 0]
      evidence_refs: [evidence.base-case-model]
      factors:
        - id: base.focused
          requires: [arena.focused]
          delta: [3, 2]
          evidence_refs: [evidence.base-case-model]
        - id: base.broad
          requires: [arena.broad]
          delta: [2, 2]
          evidence_refs: [evidence.base-case-model]
        - id: base.direct
          requires: [channel.direct]
          delta: [2, 2]
          evidence_refs: [evidence.base-case-model]
        - id: base.partner
          requires: [channel.partner]
          delta: [1, 3]
          evidence_refs: [evidence.base-case-model]
        - id: base.subscription
          requires: [economics.subscription]
          delta: [2, 1]
          evidence_refs: [evidence.base-case-model]
        - id: base.usage
          requires: [economics.usage]
          delta: [1, 2]
          evidence_refs: [evidence.base-case-model]
        - id: base.focused-direct-subscription
          requires: [arena.focused, channel.direct, economics.subscription]
          delta: [2, 1]
          evidence_refs: [evidence.base-case-model]
          alternatives: [[0, 0], [4, 2]]
          question: How large is the complementarity among focus, direct distribution, and subscription economics?
          test: Estimate the bundle interaction from a conjoint or matched-pilot model.
          cost: 2
        - id: base.broad-partner-usage
          requires: [arena.broad, channel.partner, economics.usage]
          delta: [5, 2]
          evidence_refs: [evidence.base-case-model]
          alternatives: [[0, 0], [7, 4]]
          question: Does the broad-partner-usage bundle create value beyond its component effects?
          test: Compare bundle and component contribution margins in a matched channel pilot.
          cost: 3
    - id: distribution_disruption
      weight: 0.5
      base: [0, 0]
      evidence_refs: [evidence.disruption-model]
      factors:
        - id: disruption.focused
          requires: [arena.focused]
          delta: [3, 2]
          evidence_refs: [evidence.disruption-model]
        - id: disruption.broad
          requires: [arena.broad]
          delta: [2, 1]
          evidence_refs: [evidence.disruption-model]
        - id: disruption.direct
          requires: [channel.direct]
          delta: [3, 3]
          evidence_refs: [evidence.disruption-model]
          alternatives: [[1, 1], [5, 5]]
          question: How much control does direct distribution preserve during disruption?
          test: Stress the direct-channel operating model against the disruption service levels.
          cost: 2
        - id: disruption.partner
          requires: [channel.partner]
          delta: [-2, -2]
          evidence_refs: [evidence.disruption-model]
          alternatives: [[-4, -4], [0, 0]]
          question: How much control is lost through partners during disruption?
          test: Obtain partner response commitments and replay the disruption service levels.
          cost: 1
        - id: disruption.subscription
          requires: [economics.subscription]
          delta: [2, 2]
          evidence_refs: [evidence.disruption-model]
        - id: disruption.usage
          requires: [economics.usage]
          delta: [1, 1]
          evidence_refs: [evidence.disruption-model]
        - id: disruption.focused-direct-subscription
          requires: [arena.focused, channel.direct, economics.subscription]
          delta: [1, 1]
          evidence_refs: [evidence.disruption-model]

neighborhood:
  id: one-choice-rewrite-v1
  mode: leaf_hamming
  distance: 1
  same_root_operator: true

# A grammar can be exhausted while the decision stays open. Run an independently
# authored grammar challenge before changing representation status.
